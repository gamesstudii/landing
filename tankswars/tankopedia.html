<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tanks Wars | Танкопедия</title>
  <link rel="icon" type="image/png" href="./img/asseti/logo.png">
  <link rel="apple-touch-icon" href="./img/asseti/logo.png">
  <link rel="stylesheet" href="./css/tankopedia.css">
</head>
<body>
  <main class="pageShell">
    <header class="topPanel">
      <a class="brand" href="./index.html" aria-label="Tanks Wars">
        <img src="./img/asseti/logo.png" alt="">
        <span>Танкопедия Tanks Wars</span>
      </a>
      <nav class="siteNav" aria-label="Навигация">
        <a href="./index.html">Играть</a>
        <a class="active" href="./tankopedia.html">Танкопедия</a>
      </nav>
    </header>

    <section class="heroPanel" aria-labelledby="pageTitle">
      <div>
        <h1 id="pageTitle" class="srOnly">Танкопедия Tanks Wars</h1>
      </div>
      <div class="heroStats" aria-label="Сводка">
        <div>
          <span id="visibleCount">0</span>
          <small>показано</small>
        </div>
        <div>
          <span id="totalCount">0</span>
          <small>в базе</small>
        </div>
      </div>
    </section>

    <section class="controlsPanel" aria-label="Фильтры">
      <label class="control searchControl">
        <span>Поиск</span>
        <input id="searchInput" type="search" placeholder="Название, нация, класс">
      </label>
      <label class="control">
        <span>Нация</span>
        <select id="nationFilter"></select>
      </label>
      <label class="control">
        <span>Уровень</span>
        <select id="levelFilter"></select>
      </label>
      <label class="control">
        <span>Класс</span>
        <select id="classFilter"></select>
      </label>
      <label class="control">
        <span>Тип</span>
        <select id="statusFilter">
          <option value="all">Все</option>
          <option value="regular">Обычные</option>
          <option value="premium">Премиум</option>
          <option value="developer">Разработчик</option>
          <option value="collectible">Коллекционные</option>
        </select>
      </label>
    </section>

    <section class="contentGrid">
      <div id="tankList" class="tankList" aria-label="Список танков"></div>
      <aside id="tankDetails" class="tankDetails" aria-label="Характеристики танка"></aside>
    </section>
  </main>

  <script src="./js/tankopedia-site.js"></script>
</body>
</html>
